<meta property="og:title" content="SiberJedi Arena — Think fast. Type faster. Win.">
<meta property="og:description" content="One question. Hundreds of minds. Only the sharpest takes the points. Play live from Twitch or YouTube chat.">
<meta property="og:image" content="https://siberjedi.github.io/img/icon-siberjedi.png">

<style>
  :root{
    --bg:#070914; --card:#0f1326; --card2:#141a33; --line:#252d4d;
    --txt:#eef1fb; --dim:#93a0c4; --cyan:#22d3ee; --violet:#8b5cf6; --pink:#ff2d86;
    --gold:#ffd166; --silver:#cbd5e1; --bronze:#f59e5b; --green:#34e3a4;
    --yt:#ff0033; --tw:#9146ff;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0; min-height:100vh; color:var(--txt);
    font-family:Inter,'Segoe UI',system-ui,-apple-system,'Noto Sans',sans-serif;
    background:
      radial-gradient(900px 520px at 85% -10%, rgba(139,92,246,.28), transparent 60%),
      radial-gradient(800px 480px at 5% 0%, rgba(34,211,238,.18), transparent 60%),
      var(--bg);
    overflow-x:hidden;
  }
  body::before{ /* noktali izgara */
    content:""; position:fixed; inset:0; pointer-events:none; opacity:.35;
    background-image:radial-gradient(rgba(147,160,196,.18) 1px, transparent 1px);
    background-size:22px 22px;
    mask-image:linear-gradient(180deg,#000 0%,transparent 70%);
  }
  .wrap{position:relative; width:100%; max-width:960px; margin:0 auto; padding:18px 16px 56px}

  /* ust bar */
  .top{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:34px}
  .brand{display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--txt);
    font-family:'JetBrains Mono',monospace; font-weight:800; letter-spacing:2px; font-size:15px}
  .brand img{width:34px; height:34px; border-radius:50%; border:1.5px solid var(--cyan); background:#0b1020}
  .brand span b{background:linear-gradient(90deg,var(--cyan),var(--violet),var(--pink));
    -webkit-background-clip:text; background-clip:text; color:transparent}
  .lang{appearance:none; background:var(--card); color:var(--txt); border:1px solid var(--line);
    border-radius:10px; padding:8px 30px 8px 12px; font:600 13px Inter,sans-serif; cursor:pointer;
    background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
    background-position:calc(100% - 15px) 50%, calc(100% - 10px) 50%; background-size:5px 5px; background-repeat:no-repeat}
  [dir=rtl] .lang{padding:8px 12px 8px 30px; background-position:15px 50%, 20px 50%}

  /* hero */
  .hero{text-align:center; padding:8px 0 30px}
  .onair{display:inline-flex; align-items:center; gap:8px; font:800 12px 'JetBrains Mono',monospace;
    letter-spacing:2px; padding:7px 14px; border-radius:999px; border:1px solid rgba(255,45,134,.5);
    background:rgba(255,45,134,.08); color:#ffd0e2}
  .onair.off{border-color:var(--line); background:rgba(147,160,196,.06); color:var(--dim)}
  .onair .d{width:9px; height:9px; border-radius:50%; background:var(--pink); box-shadow:0 0 12px var(--pink); animation:pulse 1.4s infinite}
  .onair.off .d{background:var(--dim); box-shadow:none; animation:none}
  @keyframes pulse{0%,100%{opacity:1; transform:scale(1)}50%{opacity:.35; transform:scale(.8)}}
  h1{font-size:clamp(36px,7.4vw,74px); line-height:1.02; font-weight:900; letter-spacing:-1.5px; margin:20px 0 16px}
  h1 .g{background:linear-gradient(90deg,var(--cyan),var(--violet) 55%,var(--pink));
    -webkit-background-clip:text; background-clip:text; color:transparent}
  .sub{max-width:640px; margin:0 auto; color:var(--dim); font-size:clamp(15px,2.1vw,18px); line-height:1.6}
  .ctas{display:flex; justify-content:center; gap:12px; flex-wrap:wrap; margin:28px 0 10px}
  .cta{display:inline-flex; align-items:center; gap:12px; text-decoration:none; color:#fff; font-weight:800;
    font-size:16px; padding:14px 22px; border-radius:14px; transition:transform .15s ease, box-shadow .15s ease;
    min-width:230px; justify-content:center}
  .cta svg{width:22px; height:22px; flex:none}
  .cta small{display:block; font-weight:600; font-size:11px; opacity:.85; letter-spacing:.5px}
  .cta.tw{background:linear-gradient(135deg,#9146ff,#6d28d9); box-shadow:0 10px 30px rgba(145,70,255,.35)}
  .cta.yt{background:linear-gradient(135deg,#ff2b4a,#c4001f); box-shadow:0 10px 30px rgba(255,0,51,.28)}
  .cta:hover{transform:translateY(-2px)}
  .nosign{color:var(--dim); font-size:13px; margin-top:8px}

  /* istatistik */
  .grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:26px 0 34px}
  @media(max-width:680px){.grid{grid-template-columns:repeat(2,1fr)}}
  .stat{background:linear-gradient(180deg,var(--card2),var(--card)); border:1px solid var(--line);
    border-radius:16px; padding:16px 12px; text-align:center}
  .stat b{display:block; font:800 clamp(24px,4vw,32px) 'JetBrains Mono',monospace; color:#fff}
  .stat span{font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:1.6px; font-weight:600}

  h2{font-size:clamp(22px,3.6vw,30px); font-weight:900; letter-spacing:-.5px; margin:0 0 16px; text-align:center}
  section{margin-bottom:40px}

  /* modlar */
  .modes{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}
  @media(max-width:760px){.modes{grid-template-columns:1fr}}
  .mode{position:relative; overflow:hidden; background:linear-gradient(180deg,var(--card2),var(--card));
    border:1px solid var(--line); border-radius:18px; padding:20px 18px}
  .mode::after{content:""; position:absolute; inset:0 0 auto 0; height:3px; background:var(--c,var(--cyan))}
  .mode .ic{font-size:28px; line-height:1}
  .mode h3{margin:12px 0 6px; font-size:18px; font-weight:800}
  .mode p{margin:0; color:var(--dim); font-size:14px; line-height:1.55}

  /* adimlar */
  .steps{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; counter-reset:s}
  @media(max-width:760px){.steps{grid-template-columns:1fr}}
  .step{display:flex; gap:14px; align-items:flex-start; padding:16px; border-radius:16px; border:1px dashed var(--line)}
  .step::before{counter-increment:s; content:counter(s); flex:none; width:34px; height:34px; border-radius:10px;
    display:grid; place-items:center; font:800 16px 'JetBrains Mono',monospace; color:#070914;
    background:linear-gradient(135deg,var(--cyan),var(--violet))}
  .step b{display:block; margin-bottom:4px}
  .step span{color:var(--dim); font-size:14px; line-height:1.5}

  /* siralama */
  .panel{background:linear-gradient(180deg,var(--card2),var(--card)); border:1px solid var(--line);
    border-radius:20px; padding:16px 16px 8px}
  .tabs{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px}
  .tab{flex:1 1 auto; min-width:100px; cursor:pointer; text-align:center; font:700 13px Inter,sans-serif;
    color:var(--dim); border:1px solid var(--line); border-radius:11px; padding:10px; background:#0b1022; transition:.15s}
  .tab.active{color:#070914; background:linear-gradient(135deg,var(--cyan),var(--violet)); border-color:transparent}
  .tbl{width:100%; overflow-x:auto}
  table{width:100%; border-collapse:collapse; font-size:14px}
  th{font-size:10px; letter-spacing:1.5px; color:var(--dim); text-transform:uppercase; text-align:start;
    padding:6px 8px; border-bottom:1px solid var(--line); font-weight:700}
  th.r,td.r{text-align:end}
  td{padding:10px 8px; border-bottom:1px solid rgba(37,45,77,.55)}
  tr:last-child td{border-bottom:0}
  .rank{width:40px}
  .medal{display:inline-grid; place-items:center; width:26px; height:26px; border-radius:8px;
    font:800 13px 'JetBrains Mono',monospace; color:var(--dim); background:#0b1022; border:1px solid var(--line)}
  tr.p1 .medal{color:#2a1d00; background:var(--gold); border-color:transparent; box-shadow:0 0 14px rgba(255,209,102,.45)}
  tr.p2 .medal{color:#111; background:var(--silver); border-color:transparent}
  tr.p3 .medal{color:#2a1200; background:var(--bronze); border-color:transparent}
  .user{font-weight:700; word-break:break-all}
  .plat{display:inline-block; width:16px; height:16px; vertical-align:-3px; margin-inline-end:7px}
  .pts{color:var(--cyan); font:800 15px 'JetBrains Mono',monospace}
  .num{color:var(--dim); font-family:'JetBrains Mono',monospace}
  .empty{padding:22px 8px; color:var(--dim); text-align:center}
  .meta{display:flex; gap:10px; flex-wrap:wrap; justify-content:space-between; font-size:13px; color:var(--dim); padding:10px 2px}
  .meta b{color:#fff}
  .warn{display:none; margin:6px 2px; font-size:12px; color:#ffb4c8}

  /* oduller */
  .awards{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:14px}
  @media(max-width:760px){.awards{grid-template-columns:repeat(2,1fr)}}
  .aw{position:relative; background:#0b1022; border:1px solid var(--line); border-radius:14px; padding:12px 12px 11px; min-width:0}
  .aw.on{border-color:rgba(255,209,102,.45); box-shadow:inset 0 0 0 1px rgba(255,209,102,.08), 0 6px 20px rgba(255,209,102,.07)}
  .aw .ai{font-size:22px; line-height:1}
  .aw .al{font-size:10px; letter-spacing:1.3px; text-transform:uppercase; color:var(--dim); font-weight:700; margin:7px 0 5px; line-height:1.3}
  .aw .au{font-weight:800; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .aw .av{font:800 13px 'JetBrains Mono',monospace; color:var(--gold); margin-top:3px}
  .aw:not(.on) .au{color:var(--dim); font-weight:600}
  .foot{text-align:center; color:var(--dim); font-size:12px; line-height:1.9; margin-top:10px}
  .foot a{color:var(--cyan); text-decoration:none}
  @media(max-width:420px){ .cta{min-width:0; width:100%} .top{margin-bottom:22px} }
</style>
</head>

  <section>

  <section>

  };
  for(var k in AW){ for(var kk in AW[k]) L[k][kk] = AW[k][kk]; }
  var ORDER = ['en','tr','es','pt','de','fr','it','ru','ar','hi','id','ja','ko','zh'];
  var NUMLOC = {en:'en-US',tr:'tr-TR',es:'es-ES',pt:'pt-BR',de:'de-DE',fr:'fr-FR',it:'it-IT',ru:'ru-RU',ar:'ar',hi:'hi-IN',id:'id-ID',ja:'ja-JP',ko:'ko-KR',zh:'zh-CN'};

  function secDil(){
    var q = (location.search.match(/[?&]lang=([a-z]{2})/) || [])[1];
    if(q && L[q]) return q;
    try { var k = localStorage.getItem('arenaLang'); if(k && L[k]) return k; } catch(e){}
    var ls = navigator.languages || [navigator.language || 'en'];
    for(var i=0;i<ls.length;i++){ var c = String(ls[i]).slice(0,2).toLowerCase(); if(L[c]) return c; }
    return 'en';
  }
  var lang = secDil(), T = L[lang];

  var sel = document.getElementById('lang');
  sel.innerHTML = ORDER.map(function(k){ return '<option value="'+k+'">'+L[k]._n+'</option>'; }).join('');

  function uygula(){
    T = L[lang];
    document.documentElement.lang = lang;
    document.documentElement.dir = T._rtl ? 'rtl' : 'ltr';
    document.title = T.title;
    sel.value = lang;
    [].forEach.call(document.querySelectorAll('[data-i]'), function(el){
      var v = T[el.getAttribute('data-i')] || L.en[el.getAttribute('data-i')];
      if(v != null) el.textContent = v;
    });
    ciz();
  }
  sel.addEventListener('change', function(){
    lang = sel.value;
    try { localStorage.setItem('arenaLang', lang); } catch(e){}
    uygula();
  });

  /* ---------- canli veri ---------- */
  var API = 'https://api.github.com/repos/siberjedi/siberjedi.github.io/contents/stats.json?ref=stats';
  var RAW = 'https://raw.githubusercontent.com/siberjedi/siberjedi.github.io/stats/stats.json';
  var etag = null, data = null, period = 'daily', hata = false;
  var $ = function(id){ return document.getElementById(id); };
  var YT = '<svg class="plat" viewBox="0 0 24 24"><path fill="#ff0033" d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8Z"/><path fill="#fff" d="M9.6 15.6V8.4l6.2 3.6z"/></svg>';
  var TW = '<svg class="plat" viewBox="0 0 24 24"><path fill="#9146ff" d="M4.3 2 3 5.4v13.7h4.7V22h2.6l2.6-2.9h3.8l5.2-5.2V2H4.3Zm15.6 11L17 15.9h-4.7l-2.6 2.6v-2.6H5.6V3.9h14.3V13Zm-2.9-6v5.2h-1.9V7H17Zm-5.2 0v5.2H9.9V7h1.9Z"/></svg>';

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function fmt(n){ try { return Number(n||0).toLocaleString(NUMLOC[lang]); } catch(e){ return String(n||0); } }
  function saat(iso){ try { return new Date(iso).toLocaleTimeString(NUMLOC[lang],{hour:'2-digit',minute:'2-digit'}); } catch(e){ return '–'; } }
  function oyuncu(u){ u = String(u||''); var yt = u.charAt(0) === '@'; return (yt ? YT : TW) + esc(yt ? u.slice(1) : u); }

  function ciz(){
    var canli = data && data.updated_ts && (Date.now()/1000 - data.updated_ts) < 240;
    $('onair').className = 'onair' + (canli ? '' : ' off');
    $('onair-t').textContent = canli ? T.live : T.off;
    if(!data){
      odulCiz();
      $('tbody').innerHTML = '<tr><td colspan="5" class="empty">' + esc(hata ? T.err : T.loading) + '</td></tr>';
      return;
    }
    var t = data.totals || {};
    $('t-rounds').textContent = fmt(t.rounds);
    $('t-players').textContent = fmt(t.players);
    $('t-guesses').textContent = fmt(t.guesses);
    $('t-points').textContent = fmt(t.points);
    $('upd').textContent = T.upd + ' ' + saat(data.updated_at);
    var liste = (data.periods && data.periods[period]) || [];
    $('tbody').innerHTML = !liste.length
      ? '<tr><td colspan="5" class="empty">' + esc(T.empty) + '</td></tr>'
      : liste.map(function(r,i){
          return '<tr class="p' + (i+1) + '"><td class="rank"><span class="medal">' + (i+1) + '</span></td>' +
            '<td class="user">' + oyuncu(r.user) + '</td>' +
            '<td class="r pts">' + fmt(r.points) + '</td>' +
            '<td class="r num">' + fmt(r.wins) + '</td>' +
            '<td class="r num">' + fmt(r.exacts) + '</td></tr>';
        }).join('');
    var lr = data.last_round;
    $('last').innerHTML = lr ? esc(T.last) + ' <b>#' + fmt(lr.round_no) + '</b> · ' +
      (lr.winner ? '🏆 ' + oyuncu(lr.winner) + ' +' + fmt(lr.points) + ' ' + esc(T.pts) : esc(T.nowin)) : '';
    $('warn').style.display = hata ? 'block' : 'none';
    odulCiz();
  }
  /* oduller: [anahtar, ikon, baslik anahtari, birim anahtari] */
  var AWK = [['wins','🏆','aWins','uWins'],['bullseye','🎯','aBull','uBull'],['guesses','💬','aGuess','uGuess'],
    ['best_round','💥','aBest','pts'],['fastest','⚡','aFast','uSec'],
    ['champ_number','🔢','m1t','pts'],['champ_word','🔤','m2t','pts'],['champ_fact','🧠','m3t','pts']];
  function odulCiz(){
    var a = (data && data.awards && data.awards[period]) || {};
    $('awards').innerHTML = AWK.map(function(w){
      var v = a[w[0]];
      var baslik = esc(T[w[2]]) + (w[0].indexOf('champ_') === 0 ? ' · ' + esc(T.aChamp) : '');
      var deger = v ? fmt(v.value) + ' ' + esc(T[w[3]]) : '';
      return '<div class="aw' + (v ? ' on' : '') + '"><div class="ai">' + w[1] + '</div><div class="al">' + baslik + '</div>' +
        '<div class="au">' + (v ? oyuncu(v.user) : esc(T.free)) + '</div>' + (v ? '<div class="av">' + deger + '</div>' : '') + '</div>';
    }).join('');
  }

  function al(url, h){
    return fetch(url, {headers:h||{}, cache:'no-store'}).then(function(r){
      if(r.status === 304) return null;
      if(!r.ok) throw new Error('HTTP ' + r.status);
      var e = r.headers.get('ETag'); if(e && h) etag = e;
      return r.text();
    });
  }
  function yukle(){
    var h = {'Accept':'application/vnd.github.raw'}; if(etag) h['If-None-Match'] = etag;
    return al(API, h)
      .catch(function(){ return al(RAW + '?t=' + Date.now()); })   /* API sinirina takilirsa */
      .then(function(txt){ if(txt){ data = JSON.parse(txt); } hata = false; ciz(); })
      .catch(function(){ hata = true; ciz(); });
  }
  $('tabs').addEventListener('click', function(ev){
    var el = ev.target.closest('.tab'); if(!el) return;
    [].forEach.call($('tabs').querySelectorAll('.tab'), function(x){ x.classList.remove('active'); });
    el.classList.add('active'); period = el.getAttribute('data-p'); ciz();
  });

  uygula();
  yukle();
  setInterval(yukle, 60000);
})();
