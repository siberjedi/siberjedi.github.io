<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Clash · Smartest in chat? Prove it.</title>
<meta name="description" content="Live quiz you play from Kick, Twitch or YouTube chat. New question every round, no sign-up. Daily, weekly and monthly leaderboard.">
<meta property="og:title" content="Chat Clash · Smartest in chat? Prove it.">
<meta property="og:description" content="New question every round. Type your answer in chat, fastest or closest wins. Play live on Kick, Twitch or YouTube.">
<meta property="og:image" content="https://siberjedi.com/img/icon-siberjedi.png">
<meta name="theme-color" content="#101014">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=Archivo+Black&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#101014; --card:#18181f; --line:#2c2c38; --ink:#000;
    --txt:#f2f0ea; --dim:#9a98a6; --acc:#ffd400; --acc2:#ff4d2e;
    --gold:#ffd400; --silver:#d6d3cc; --bronze:#e08a4f; --yt:#ff0033; --tw:#9146ff;
  }
  *{box-sizing:border-box}
  body{margin:0; min-height:100vh; color:var(--txt); background:var(--bg);
    font-family:Archivo,'Segoe UI',system-ui,-apple-system,'Noto Sans',sans-serif; overflow-x:hidden}
  .wrap{width:100%; max-width:940px; margin:0 auto; padding:18px 16px 56px}

  .top{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:30px;
    padding-bottom:14px; border-bottom:2px solid var(--line)}
  .brand{display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--txt);
    font-family:'Archivo Black',Archivo,sans-serif; font-size:17px; letter-spacing:.5px}
  .brand img{width:34px; height:34px; border-radius:8px; border:2px solid var(--txt); background:#000}
  .brand span b{color:var(--acc); font-weight:400}
  .topr{display:flex; align-items:center; gap:8px}
  .home{display:inline-flex; align-items:center; gap:6px; text-decoration:none; color:var(--txt); background:var(--card);
    border:2px solid var(--line); border-radius:8px; padding:7px 12px; font:700 13px Archivo,sans-serif; letter-spacing:.5px; white-space:nowrap}
  .home b{color:#ff0080; font-weight:700}
  .home:hover{border-color:var(--acc)}
  [dir=rtl] .home .ar{transform:scaleX(-1)}
  @media(max-width:480px){ .top{gap:8px} .brand{font-size:14px; gap:8px} .brand img{width:30px; height:30px} .topr{gap:6px; min-width:0} .home{padding:7px 9px; font-size:12px} .lang{padding:8px 24px 8px 9px; max-width:96px; font-size:12px; background-position:calc(100% - 13px) 50%, calc(100% - 8px) 50%} }
  .lang{appearance:none; background:var(--card); color:var(--txt); border:2px solid var(--line);
    border-radius:8px; padding:8px 30px 8px 12px; font:700 13px Archivo,sans-serif; cursor:pointer;
    background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
    background-position:calc(100% - 15px) 50%, calc(100% - 10px) 50%; background-size:5px 5px; background-repeat:no-repeat}
  [dir=rtl] .lang{padding:8px 12px 8px 30px; background-position:15px 50%, 20px 50%}

  .hero{padding:6px 0 28px}
  .onair{display:inline-flex; align-items:center; gap:8px; font:800 12px 'JetBrains Mono',monospace;
    letter-spacing:1.5px; padding:6px 10px; border-radius:6px; background:var(--acc2); color:#fff}
  .onair.off{background:var(--card); color:var(--dim); border:2px solid var(--line)}
  .onair .d{width:8px; height:8px; border-radius:50%; background:#fff; animation:blink 1s steps(2,start) infinite}
  .onair.off .d{background:var(--dim); animation:none}
  @keyframes blink{to{visibility:hidden}}
  h1{font-family:'Archivo Black',Archivo,sans-serif; font-weight:400; font-size:clamp(40px,8.4vw,86px);
    line-height:.98; letter-spacing:-1px; margin:18px 0 18px; text-transform:uppercase}
  h1 .g{color:var(--acc); display:inline-block; text-shadow:4px 4px 0 var(--ink); -webkit-text-stroke:0}
  .sub{max-width:600px; margin:0; color:#cfcdd6; font-size:clamp(15px,2vw,18px); line-height:1.6}
  .ctas{display:flex; gap:12px; flex-wrap:wrap; margin:26px 0 10px}
  .ctas .cta{flex:1 1 0}
  .cta{display:inline-flex; align-items:center; gap:12px; text-decoration:none; color:#fff; font-weight:900;
    font-size:16px; padding:13px 20px; border-radius:10px; border:2px solid var(--ink);
    box-shadow:4px 4px 0 var(--ink); transition:transform .08s, box-shadow .08s; min-width:220px}
  .cta svg{width:22px; height:22px; flex:none}
  .cta small{display:block; font-weight:600; font-size:11px; opacity:.9}
  .cta.tw{background:var(--tw)} .cta.yt{background:var(--yt)} .cta.kick{background:#53fc18;color:#0b0b0b}
  .cta:hover{transform:translate(-2px,-2px); box-shadow:6px 6px 0 var(--ink)}
  .cta:active{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink)}
  .nosign{color:var(--dim); font-size:13px; margin-top:6px}
  .live{margin-top:18px; aspect-ratio:16/9; background:#000; border:2px solid var(--ink); border-radius:10px; overflow:hidden; box-shadow:4px 4px 0 var(--ink)}
  .live iframe{display:block; width:100%; height:100%; border:0}
  .ltabs{display:flex; gap:8px; margin-top:18px}
  .ltabs + .live{margin-top:8px}
  .lt{flex:1 1 0; font:800 13px inherit; font-family:inherit; padding:8px 10px; border-radius:8px; border:2px solid var(--line); background:var(--card); color:var(--dim); cursor:pointer}
  .lt.on{color:#fff; border-color:var(--ink)}
  .lt.kick.on{background:#53fc18; color:#0b0b0b} .lt.tw.on{background:var(--tw)} .lt.yt.on{background:var(--yt)}

  .grid{display:grid; grid-template-columns:repeat(4,1fr); gap:0; margin:24px 0 36px;
    border:2px solid var(--line); border-radius:12px; overflow:hidden}
  @media(max-width:680px){.grid{grid-template-columns:repeat(2,1fr)}}
  .stat{background:var(--card); padding:16px 12px; text-align:center; border-inline-end:2px solid var(--line)}
  .stat:last-child{border-inline-end:0}
  @media(max-width:680px){.stat:nth-child(2){border-inline-end:0} .stat:nth-child(-n+2){border-bottom:2px solid var(--line)}}
  .stat b{display:block; font:800 clamp(26px,4vw,34px) 'JetBrains Mono',monospace; color:var(--acc)}
  .stat span{font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:1.4px; font-weight:700}

  h2{font-family:'Archivo Black',Archivo,sans-serif; font-weight:400; font-size:clamp(22px,3.4vw,30px);
    text-transform:uppercase; margin:0 0 14px; display:flex; align-items:center; gap:12px}
  h2::after{content:""; flex:1; height:2px; background:var(--line)}
  section{margin-bottom:40px}

  .modes{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}
  @media(max-width:760px){.modes{grid-template-columns:1fr}}
  .mode{background:var(--card); border:2px solid var(--line); border-radius:12px; padding:18px}
  .mode .ic{display:inline-block; font:800 15px 'JetBrains Mono',monospace; color:var(--ink);
    background:var(--c,var(--acc)); padding:4px 9px; border-radius:6px}
  .mode h3{margin:12px 0 6px; font-size:18px; font-weight:900}
  .mode p{margin:0; color:var(--dim); font-size:14px; line-height:1.55}

  .steps{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; counter-reset:s}
  @media(max-width:760px){.steps{grid-template-columns:1fr}}
  .step{display:flex; gap:14px; align-items:flex-start; padding:4px 0}
  .step::before{counter-increment:s; content:counter(s); flex:none; width:36px; height:36px; border-radius:8px;
    display:grid; place-items:center; font:800 17px 'JetBrains Mono',monospace; color:var(--ink);
    background:var(--acc); border:2px solid var(--ink); box-shadow:3px 3px 0 var(--ink)}
  .step b{display:block; margin-bottom:3px; font-weight:900}
  .step span{color:var(--dim); font-size:14px; line-height:1.5}

  .panel{background:var(--card); border:2px solid var(--line); border-radius:12px; padding:14px 14px 6px}
  .tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px}
  .tab{flex:1 1 auto; min-width:96px; cursor:pointer; text-align:center; font:800 13px Archivo,sans-serif;
    color:var(--dim); border:2px solid var(--line); border-radius:8px; padding:9px; background:var(--bg)}
  .tab:hover{color:var(--txt)}
  .tab.active{color:var(--ink); background:var(--acc); border-color:var(--ink)}
  .tbl{width:100%; overflow-x:auto}
  table{width:100%; border-collapse:collapse; font-size:14px}
  th{font-size:10px; letter-spacing:1.4px; color:var(--dim); text-transform:uppercase; text-align:start;
    padding:6px 8px; border-bottom:2px solid var(--line); font-weight:800}
  th.r,td.r{text-align:end}
  td{padding:10px 8px; border-bottom:1px solid var(--line)}
  tr:last-child td{border-bottom:0}
  .rank{width:40px}
  .medal{display:inline-grid; place-items:center; width:26px; height:26px; border-radius:6px;
    font:800 13px 'JetBrains Mono',monospace; color:var(--dim); background:var(--bg); border:2px solid var(--line)}
  tr.p1 .medal{color:var(--ink); background:var(--gold); border-color:var(--ink)}
  tr.p2 .medal{color:var(--ink); background:var(--silver); border-color:var(--ink)}
  tr.p3 .medal{color:var(--ink); background:var(--bronze); border-color:var(--ink)}
  .user{font-weight:800; word-break:break-all}
  .plat{display:inline-block; width:16px; height:16px; vertical-align:-3px; margin-inline-end:7px}
  .pts{color:var(--acc); font:800 15px 'JetBrains Mono',monospace}
  .num{color:var(--dim); font-family:'JetBrains Mono',monospace}
  .empty{padding:22px 8px; color:var(--dim); text-align:center}
  .meta{display:flex; gap:10px; flex-wrap:wrap; justify-content:space-between; font-size:13px; color:var(--dim); padding:10px 2px}
  .meta b{color:var(--txt)}
  .warn{display:none; margin:6px 2px; font-size:12px; color:#ff9b8a}

  .awards{display:grid; grid-template-columns:repeat(4,1fr); gap:10px}
  @media(max-width:760px){.awards{grid-template-columns:repeat(2,1fr)}}
  .aw{background:var(--card); border:2px solid var(--line); border-radius:10px; padding:12px; min-width:0}
  .aw.on{border-color:var(--acc)}
  .aw .ai{font-size:20px; line-height:1}
  .aw .al{font-size:10px; letter-spacing:1.2px; text-transform:uppercase; color:var(--dim); font-weight:800; margin:8px 0 5px; line-height:1.3}
  .aw .au{font-weight:900; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .aw .av{font:800 13px 'JetBrains Mono',monospace; color:var(--acc); margin-top:3px}
  .aw:not(.on) .au{color:var(--dim); font-weight:600}
  .awl{list-style:none; margin:10px 0 0; padding:8px 0 0; border-top:1px dashed var(--line); font-size:12px}
  .awl li{display:flex; align-items:center; gap:6px; padding:2px 0; min-width:0}
  .awl .n{flex:none; width:16px; color:var(--dim); font:800 11px 'JetBrains Mono',monospace}
  .awl .u{flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:700; color:#cfcdd6}
  .awl .u .plat{width:13px; height:13px; vertical-align:-2px; margin-inline-end:5px}
  .awl .v{flex:none; color:var(--acc); font:800 11px 'JetBrains Mono',monospace}

  /* ulkeler */
  .hint{color:var(--dim); font-size:13px; margin:-4px 0 12px}
  .hint code{font:800 13px 'JetBrains Mono',monospace; color:var(--ink); background:var(--acc); padding:2px 6px; border-radius:5px}
  .flag{width:24px; height:18px; border-radius:3px; vertical-align:-4px; margin-inline-end:9px; border:1px solid #000; object-fit:cover}
  .conts{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:14px}
  @media(max-width:760px){.conts{grid-template-columns:repeat(2,1fr)}}
  .foot{color:var(--dim); font-size:12px; line-height:1.9; margin-top:10px; padding-top:14px; border-top:2px solid var(--line)}
  .foot a{color:var(--txt); text-decoration:underline; text-underline-offset:3px}
  @media(max-width:700px){ .ctas .cta{flex:1 1 100%; min-width:0; width:100%} }
</style>
</head>

  var $ = function(id){ return document.getElementById(id); };

  var TW = '<svg class="plat" viewBox="0 0 24 24"><path fill="#9146ff" d="M4.3 2 3 5.4v13.7h4.7V22h2.6l2.6-2.9h3.8l5.2-5.2V2H4.3Zm15.6 11L17 15.9h-4.7l-2.6 2.6v-2.6H5.6V3.9h14.3V13Zm-2.9-6v5.2h-1.9V7H17Zm-5.2 0v5.2H9.9V7h1.9Z"/></svg>';

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function fmt(n){ try { return Number(n||0).toLocaleString(NUMLOC[lang]); } catch(e){ return String(n||0); } }
  function saat(iso){ try { return new Date(iso).toLocaleTimeString(NUMLOC[lang],{hour:'2-digit',minute:'2-digit'}); } catch(e){ return '–'; } }
  function oyuncu(u){ u = String(u||''); var yt = u.charAt(0) === '@'; return (yt ? YT : TW) + esc(yt ? u.slice(1) : u); }

  function ciz(){
    var canli = data && data.updated_ts && (Date.now()/1000 - data.updated_ts) < 240;
    $('onair').className = 'onair' + (canli ? '' : ' off');
    $('onair-t').textContent = canli ? T.live : T.off;
    if(!data){
      odulCiz(); ulkeCiz();
      $('tbody').innerHTML = '<tr><td colspan="5" class="empty">' + esc(hata ? T.err : T.loading) + '</td></tr>';
      return;
    }
    var t = data.totals || {};
    $('t-rounds').textContent = fmt(t.rounds);
    $('t-players').textContent = fmt(t.players);
    $('t-guesses').textContent = fmt(t.guesses);
    $('t-points').textContent = fmt(t.points);
    $('upd').textContent = T.upd + ' ' + saat(data.updated_at);
    var liste = (data.periods && data.periods[period]) || [];
    $('tbody').innerHTML = !liste.length
      ? '<tr><td colspan="5" class="empty">' + esc(T.empty) + '</td></tr>'
      : liste.map(function(r,i){
          return '<tr class="p' + (i+1) + '"><td class="rank"><span class="medal">' + (i+1) + '</span></td>' +
            '<td class="user">' + oyuncu(r.user) + '</td>' +
            '<td class="r pts">' + fmt(r.points) + '</td>' +
            '<td class="r num">' + fmt(r.wins) + '</td>' +
            '<td class="r num">' + fmt(r.exacts) + '</td></tr>';
        }).join('');
    var lr = data.last_round;
    $('last').innerHTML = lr ? esc(T.last) + ' <b>#' + fmt(lr.round_no) + '</b> · ' +
      (lr.winner ? '🏆 ' + oyuncu(lr.winner) + ' +' + fmt(lr.points) + ' ' + esc(T.pts) : esc(T.nowin)) : '';
    $('warn').style.display = hata ? 'block' : 'none';
    odulCiz();
    ulkeCiz();
  }
  function ulkeAdi(k){ try { return new Intl.DisplayNames([NUMLOC[lang]], {type:'region'}).of(k) || k; } catch(e){ return k; } }
  function bayrak(k){ return '<img class="flag" loading="lazy" alt="" src="https://flagcdn.com/w40/' + esc(String(k).toLowerCase()) + '.png">'; }
  function ulkeCiz(){
    $('ct-hint').innerHTML = esc(T.ctHint).replace(/!country [A-Z]{2}/g, function(m){ return '<code>' + m + '</code>'; });
    var liste = (data && data.countries && data.countries[period]) || [];
    $('ct-body').innerHTML = !liste.length
      ? '<tr><td colspan="4" class="empty">' + esc(T.ctEmpty) + '</td></tr>'
      : liste.map(function(r,i){
          return '<tr class="p' + (i+1) + '"><td class="rank"><span class="medal">' + (i+1) + '</span></td>' +
            '<td class="user">' + bayrak(r.code) + esc(ulkeAdi(r.code)) + '</td>' +
            '<td class="r pts">' + fmt(r.points) + '</td><td class="r num">' + fmt(r.players) + '</td></tr>';
        }).join('');
    var k = (data && data.continents && data.continents[period]) || {};
    $('conts').innerHTML = ['EU','AS','NA','SA','AF','OC'].map(function(c){
      var v = k[c];
      return '<div class="aw' + (v ? ' on' : '') + '"><div class="al" style="margin-top:0">' + esc(T[c]) + '</div>' +
        '<div class="au">' + (v ? bayrak(v.country) + oyuncu(v.user) : esc(T.free)) + '</div>' +
        (v ? '<div class="av">' + fmt(v.points) + ' ' + esc(T.pts) + '</div>' : '') + '</div>';
    }).join('');
  }
  /* oduller: [anahtar, ikon, baslik anahtari, birim anahtari] */
  var AWK = [['wins','🏆','aWins','uWins'],['bullseye','🎯','aBull','uBull'],['guesses','💬','aGuess','uGuess'],
    ['best_round','💥','aBest','pts'],['fastest','⚡','aFast','uSec'],
    ['champ_number','🔢','m1t','pts'],['champ_word','🔤','m2t','pts'],['champ_fact','🧠','m3t','pts']];
  function odulCiz(){
    var a = (data && data.awards && data.awards[period]) || {};
    $('awards').innerHTML = AWK.map(function(w){
      var v = a[w[0]];
      var baslik = esc(T[w[2]]) + (w[0].indexOf('champ_') === 0 ? ' · ' + esc(T.aChamp) : '');
      var deger = v ? fmt(v.value) + ' ' + esc(T[w[3]]) : '';
      return '<div class="aw' + (v ? ' on' : '') + '"><div class="ai">' + w[1] + '</div><div class="al">' + baslik + '</div>' +
        '<div class="au">' + (v ? oyuncu(v.user) : esc(T.free)) + '</div>' + (v ? '<div class="av">' + deger + '</div>' : '') +
        (v && v.top && v.top.length > 1 ? '<ol class="awl">' + v.top.slice(1, 5).map(function(r, i){
          return '<li><span class="n">' + (i + 2) + '</span><span class="u">' + oyuncu(r.user) + '</span><span class="v">' + fmt(r.value) + '</span></li>';
        }).join('') + '</ol>' : '') + '</div>';
    }).join('');
  }

  function al(url, h){
    return fetch(url, {headers:h||{}, cache:'no-store'}).then(function(r){
      if(r.status === 304) return null;
      if(!r.ok) throw new Error('HTTP ' + r.status);
      var e = r.headers.get('ETag'); if(e && h) etag = e;
      return r.text();
    });
  }
  function yukle(){
    var h = {'Accept':'application/vnd.github.raw'}; if(etag) h['If-None-Match'] = etag;
    return al(API, h)
      .catch(function(){ return al(RAW + '?t=' + Date.now()); })   /* API sinirina takilirsa */
      .then(function(txt){ if(txt){ data = JSON.parse(txt); } hata = false; ciz(); })
      .catch(function(){ hata = true; ciz(); });
  }
  $('tabs').addEventListener('click', function(ev){
    var el = ev.target.closest('.tab'); if(!el) return;
    [].forEach.call($('tabs').querySelectorAll('.tab'), function(x){ x.classList.remove('active'); });
    el.classList.add('active'); period = el.getAttribute('data-p'); ciz();
  });

  uygula();
  yukle();
  setInterval(yukle, 60000);
})();
</script>
</body>
</html>
